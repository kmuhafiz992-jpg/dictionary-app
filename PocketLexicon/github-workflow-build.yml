name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # GitHub has internet, so the word data is downloaded here, once, and packed into the APK.
      # The finished app never goes online.
      - name: Build the offline word data
        run: |
          python -m pip install --upgrade pip nltk
          python tools/build_lexicon.py --out app/src/main/assets/lex --report build-report.txt

      - name: Download the Urdu font (optional)
        continue-on-error: true
        run: |
          mkdir -p app/src/main/assets/fonts
          curl -fsSL -o app/src/main/assets/fonts/NotoNastaliqUrdu.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/notonastaliqurdu/NotoNastaliqUrdu%5Bwght%5D.ttf" || echo "Urdu font download skipped"

      - name: Save the data report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-report
          path: build-report.txt
          if-no-files-found: ignore

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build the debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketLexicon-APK
          path: app/build/outputs/apk/debug/app-debug.apk
