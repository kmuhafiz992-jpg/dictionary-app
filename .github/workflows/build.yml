name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      # Works whether the files are at the top of the repository or inside a folder such as PocketLexicon.
      - name: Find the project folder
        id: proj
        run: |
          FILE=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "settings.gradle was not found. Upload the project files to the repository."
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Project folder: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # GitHub has internet, so the word data is downloaded here, once, and packed into the APK.
      # The finished app never goes online.
      - name: Build the offline word data
        run: |
          python -m pip install --upgrade pip nltk
          python "${{ steps.proj.outputs.dir }}/tools/build_lexicon.py" --out "${{ steps.proj.outputs.dir }}/app/src/main/assets/lex" --report build-report.txt

      - name: Download the Urdu font (optional)
        continue-on-error: true
        run: |
          mkdir -p "${{ steps.proj.outputs.dir }}/app/src/main/assets/fonts"
          curl -fsSL -o "${{ steps.proj.outputs.dir }}/app/src/main/assets/fonts/NotoNastaliqUrdu.ttf" "https://raw.githubusercontent.com/google/fonts/main/ofl/notonastaliqurdu/NotoNastaliqUrdu%5Bwght%5D.ttf" || echo "Urdu font download skipped"

      - name: Save the data report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-report
          path: build-report.txt
          if-no-files-found: ignore

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build the debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketLexicon-APK
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
